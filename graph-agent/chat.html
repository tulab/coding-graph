<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>graph-agent 对话测试</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #2c2c2c; }
  h1 { font-size: 20px; }
  #chat { border: 1px solid #ddd; border-radius: 8px; height: 380px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #fafafa; }
  .msg { margin: 6px 0; }
  .user { text-align: right; color: #0a6cff; }
  .ai { white-space: pre-wrap; }
  .wait { color: #999; font-style: italic; }
  #form { display: flex; gap: 8px; }
  #input { flex: 1; padding: 8px; font-size: 15px; }
  button { padding: 8px 18px; }
</style>
</head>
<body>
  <h1>graph-agent 对话测试（DeepSeek · 多轮）</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="输入消息…" autocomplete="off" />
    <button type="submit">发送</button>
    <button type="button" id="reset">新对话</button>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const resetBtn = document.getElementById("reset");

    resetBtn.addEventListener("click", async () => {
      try {
        await fetch("http://localhost:3004/api/chat/reset", { method: "POST" });
      } catch { /* 后端不在线也能清本地列表 */ }
      chat.innerHTML = "";
    });

    function add(type, text) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.append(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      add("user", msg);
      const ai = add("ai", "");
      const wait = add("wait", "…思考中");
      try {
        const res = await fetch("http://localhost:3004/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg }),
        });
        wait.remove();
        // 读 SSE 流
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const evt = JSON.parse(line.slice(6));
            if (evt.delta) ai.textContent += evt.delta;
            if (evt.done) break;
          }
        }
      } catch (err) {
        wait.remove();
        add("ai", "出错：" + err.message);
      }
    });
  </script>
</body>
</html>
